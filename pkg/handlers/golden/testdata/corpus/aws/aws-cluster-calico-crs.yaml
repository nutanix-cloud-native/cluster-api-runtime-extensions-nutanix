apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  labels:
    cluster.x-k8s.io/provider: aws
  name: aws-quick-start
spec:
  controlPlane:
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        name: aws-quick-start-control-plane
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: aws-quick-start-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: AWSClusterTemplate
      name: aws-quick-start
  patches:
    - external:
        discoverVariablesExtension: awsclusterconfigvars-dv.cluster-api-runtime-extensions-nutanix
        generatePatchesExtension: awsclusterv7configpatch-gp.cluster-api-runtime-extensions-nutanix
      name: cluster-config
    - external:
        discoverVariablesExtension: awsworkerconfigvars-dv.cluster-api-runtime-extensions-nutanix
        generatePatchesExtension: awsworkerv7configpatch-gp.cluster-api-runtime-extensions-nutanix
      name: worker-config
  workers:
    machineDeployments:
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: aws-quick-start-worker-bootstraptemplate
        class: default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSMachineTemplate
            name: aws-quick-start-worker-machinetemplate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSClusterTemplate
metadata:
  labels:
    cluster.x-k8s.io/provider: aws
  name: aws-quick-start
spec:
  template:
    spec:
      controlPlaneLoadBalancer:
        healthCheckProtocol: HTTPS
        loadBalancerType: nlb
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  labels:
    cluster.x-k8s.io/provider: aws
  name: aws-quick-start-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - name: admission-control-config-file
                value: /etc/kubernetes/admission.yaml
              - name: enable-admission-plugins
                value: DenyServiceExternalIPs,EventRateLimit,NodeRestriction
              - name: profiling
                value: "false"
              - name: service-account-lookup
                value: "true"
              - name: tls-cipher-suites
                value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
            extraVolumes:
              - hostPath: /etc/kubernetes/admission.yaml
                mountPath: /etc/kubernetes/admission.yaml
                name: admission-config
                pathType: File
                readOnly: true
              - hostPath: /etc/kubernetes/eventratelimit-config.yaml
                mountPath: /etc/kubernetes/eventratelimit-config.yaml
                name: eventratelimit-config
                pathType: File
                readOnly: true
          controllerManager:
            extraArgs:
              - name: cloud-provider
                value: external
              - name: profiling
                value: "false"
              - name: terminated-pod-gc-threshold
                value: "10000"
              - name: tls-min-version
                value: VersionTLS12
          scheduler:
            extraArgs:
              - name: profiling
                value: "false"
              - name: tls-min-version
                value: VersionTLS12
        files:
          - content: |
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              evictionHard:
                nodefs.available: "10%"
                nodefs.inodesFree: "5%"
                imagefs.available: "15%"
                memory.available: "100Mi"
                imagefs.inodesFree: "10%"
            path: /etc/kubernetes/patches/kubeletconfiguration0+strategic.json
            permissions: "0600"
          - content: |
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              # 4.2.4 Ensure that the --read-only-port argument is set to 0
              readOnlyPort: 0
              # 4.2.5 Ensure that the --streaming-connection-idle-timeout argument is not set to 0
              # Recommendation: Set to 5m instead of 4h as per CIS guidelines
              streamingConnectionIdleTimeout: "5m"
              # 4.2.8 Ensure that the event-qps argument is set to a level which ensures appropriate event capture
              eventRecordQPS: 5
              # 4.2.12 Updated with recommended strong cipher suites
              tlsCipherSuites: [TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384]
              # 4.2.13 Ensure that a limit is set on pod PIDs
              podPidsLimit: 4096
            path: /etc/kubernetes/patches/kubeletconfiguration1+strategic.json
            permissions: "0600"
          - content: |
              apiVersion: apiserver.config.k8s.io/v1
              kind: AdmissionConfiguration
              plugins:
              - name: EventRateLimit
                path: /etc/kubernetes/eventratelimit-config.yaml
            path: /etc/kubernetes/admission.yaml
            permissions: "0600"
          - content: |
              apiVersion: eventratelimit.admission.k8s.io/v1alpha1
              kind: Configuration
              limits:
              - type: Server
                qps: 10000
                burst: 40000
            path: /etc/kubernetes/eventratelimit-config.yaml
            permissions: "0600"
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: cloud-provider
                value: external
            name: '{{ ds.meta_data.local_hostname }}'
          patches:
            directory: /etc/kubernetes/patches
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: cloud-provider
                value: external
            name: '{{ ds.meta_data.local_hostname }}'
          patches:
            directory: /etc/kubernetes/patches
        postKubeadmCommands:
          - chmod 600 "$(systemctl show -P FragmentPath kubelet.service)"
          - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
          - chmod 600 /var/lib/kubelet/config.yaml
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/provider: aws
  name: aws-quick-start-control-plane
spec:
  template:
    spec:
      instanceType: PLACEHOLDER
      sshKeyName: ""
