        - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
        - chmod 600 /var/lib/kubelet/config.yaml
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/provider: aws
  name: golden
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    serviceDomain: "cluster.local"
    services:
      cidrBlocks:
      - 10.128.0.0/12
  topology:
    classRef:
      name: aws-quick-start
    controlPlane:
      replicas: 1
    variables:
    - name: clusterConfig
      value:
        addons:
          ccm:
            strategy: ClusterResourceSet
          clusterAutoscaler:
            strategy: ClusterResourceSet
          cni:
            provider: Calico
            strategy: ClusterResourceSet
          csi:
            defaultStorage:
              provider: aws-ebs
              storageClassConfig: default
            providers:
              aws-ebs:
                storageClassConfigs:
                  default: {}
                strategy: ClusterResourceSet
            snapshotController:
              strategy: ClusterResourceSet
          nfd:
            strategy: ClusterResourceSet
        aws:
          region: us-west-2
        controlPlane:
          aws:
            ami:
              lookup:
                baseOS: rocky-9.1
                format: konvoy-ami-{{.BaseOS}}-release-?{{.K8sVersion}}-*
                org: "123456789012"
        dns:
          coreDNS: {}
        encryptionAtRest:
          providers:
          - aescbc: {}
    - name: workerConfig
      value:
        aws:
          ami:
            lookup:
              baseOS: rocky-9.1
              format: konvoy-ami-{{.BaseOS}}-release-?{{.K8sVersion}}-*
              org: "123456789012"
    version: v1.35.3
    workers:
      machineDeployments:
      - class: default-worker
        metadata:
          annotations:
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "1"
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
        name: md-0
