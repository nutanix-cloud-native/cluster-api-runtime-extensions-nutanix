status: Success
variables:
- name: clusterConfig
  required: true
  schema:
    openAPIV3Schema:
      description: NutanixClusterConfigSpec defines the desired state of NutanixClusterConfig.
      exclusiveMaximum: false
      exclusiveMinimum: false
      properties:
        addons:
          exclusiveMaximum: false
          exclusiveMinimum: false
          properties:
            ccm:
              description: CCM tells us to enable or disable the cloud provider interface.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                credentials:
                  description: A reference to the Secret for credential information
                    for the target Prism Central instance
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    secretRef:
                      description: A reference to the Secret containing the credentials
                        used by the CCM provider.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      properties:
                        name:
                          description: |-
                            Name of the referent.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          maxLength: 253
                          minLength: 1
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                      required:
                      - name
                      type: object
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - secretRef
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                strategy:
                  default: HelmAddon
                  description: Addon strategy used to deploy the CCM to the workload
                    cluster.
                  enum:
                  - ClusterResourceSet
                  - HelmAddon
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            clusterAutoscaler:
              description: ClusterAutoscaler tells us to enable or disable the cluster-autoscaler
                addon.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                strategy:
                  default: HelmAddon
                  description: |-
                    Addon strategy used to deploy cluster-autoscaler to the management cluster
                    targeting the workload cluster.
                  enum:
                  - ClusterResourceSet
                  - HelmAddon
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            cni:
              description: NutanixCNI defines CNI configuration for Nutanix clusters,
                which additionally support Flow.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                imagePullCredentials:
                  description: |-
                    ImagePullCredentials is a reference to a Secret with image pull credentials
                    for the CNI provider images. The Secret will be copied to the workload cluster.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    secretRef:
                      description: A reference to the Secret containing the image
                        pull credentials.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      properties:
                        name:
                          description: |-
                            Name of the referent.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          maxLength: 253
                          minLength: 1
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                      required:
                      - name
                      type: object
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - secretRef
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                provider:
                  description: CNI provider to deploy.
                  enum:
                  - Calico
                  - Cilium
                  - Flow
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                strategy:
                  default: HelmAddon
                  description: Addon strategy used to deploy the CNI provider to the
                    workload cluster.
                  enum:
                  - ClusterResourceSet
                  - HelmAddon
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                values:
                  description: Values contains the helm values for the CNI when HelmAddon
                    is the strategy.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    sourceRef:
                      description: |-
                        SourceRef is an object reference to Configmap/Secret inside the same namespace
                        which contains inline YAML representing the values for the Helm chart.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      properties:
                        kind:
                          description: Kind is the type of resource being referenced,
                            valid values are ('ConfigMap').
                          enum:
                          - ConfigMap
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                        name:
                          description: Name is the name of resource being referenced.
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          maxLength: 253
                          minLength: 1
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                      required:
                      - kind
                      - name
                      type: object
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              required:
              - provider
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            cosi:
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                strategy:
                  default: HelmAddon
                  description: Addon strategy used to deploy the COSI controller to
                    the workload cluster.
                  enum:
                  - HelmAddon
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            csi:
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                defaultStorage:
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    provider:
                      description: Name of the CSI Provider for the default storage
                        class.
                      enum:
                      - nutanix
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      type: string
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                    storageClassConfig:
                      description: Name of the default storage class config the specified
                        default provider.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      maxLength: 242
                      minLength: 1
                      type: string
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - provider
                  - storageClassConfig
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                providers:
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    nutanix:
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      properties:
                        credentials:
                          description: The reference to any secret used by the CSI
                            Provider.
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          properties:
                            secretRef:
                              description: A reference to the Secret containing the
                                credentials used by the CSI provider.
                              exclusiveMaximum: false
                              exclusiveMinimum: false
                              properties:
                                name:
                                  description: |-
                                    Name of the referent.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  exclusiveMaximum: false
                                  exclusiveMinimum: false
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                  uniqueItems: false
                                  x-kubernetes-preserve-unknown-fields: false
                              required:
                              - name
                              type: object
                              uniqueItems: false
                              x-kubernetes-preserve-unknown-fields: false
                          required:
                          - secretRef
                          type: object
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                        storageClassConfigs:
                          additionalProperties:
                            exclusiveMaximum: false
                            exclusiveMinimum: false
                            properties:
                              allowExpansion:
                                description: If the storage class should allow volume
                                  expanding
                                exclusiveMaximum: false
                                exclusiveMinimum: false
                                type: boolean
                                uniqueItems: false
                                x-kubernetes-preserve-unknown-fields: false
                              parameters:
                                additionalProperties:
                                  exclusiveMaximum: false
                                  exclusiveMinimum: false
                                  type: string
                                  uniqueItems: false
                                  x-kubernetes-preserve-unknown-fields: false
                                description: Parameters passed into the storage class
                                  object.
                                exclusiveMaximum: false
                                exclusiveMinimum: false
                                type: object
                                uniqueItems: false
                                x-kubernetes-preserve-unknown-fields: false
                              reclaimPolicy:
                                default: Delete
                                description: PersistentVolumeReclaimPolicy describes
                                  a policy for end-of-life maintenance of persistent
                                  volumes.
                                enum:
                                - Delete
                                - Retain
                                - Recycle
                                exclusiveMaximum: false
                                exclusiveMinimum: false
                                type: string
                                uniqueItems: false
                                x-kubernetes-preserve-unknown-fields: false
                              volumeBindingMode:
                                default: WaitForFirstConsumer
                                description: VolumeBindingMode indicates how PersistentVolumeClaims
                                  should be bound.
                                enum:
                                - Immediate
                                - WaitForFirstConsumer
                                exclusiveMaximum: false
                                exclusiveMinimum: false
                                type: string
                                uniqueItems: false
                                x-kubernetes-preserve-unknown-fields: false
                            type: object
                            uniqueItems: false
                            x-kubernetes-preserve-unknown-fields: false
                          description: StorageClassConfigs is a map of storage class
                            configurations for this CSI provider.
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          type: object
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                        strategy:
                          default: HelmAddon
                          description: Addon strategy used to deploy the CSI provider
                            to the workload cluster.
                          enum:
                          - ClusterResourceSet
                          - HelmAddon
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                      required:
                      - storageClassConfigs
                      type: object
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - nutanix
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                snapshotController:
                  description: Deploy the CSI snapshot controller and associated CRDs.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    strategy:
                      default: HelmAddon
                      description: Addon strategy used to deploy the snapshot controller
                        to the workload cluster.
                      enum:
                      - ClusterResourceSet
                      - HelmAddon
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      type: string
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              required:
              - defaultStorage
              - providers
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            konnectorAgent:
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                credentials:
                  description: A reference to the Secret for credential information
                    for the target Prism Central instance
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    secretRef:
                      description: A reference to the Secret containing the credentials
                        used by the Konnector agent.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      properties:
                        name:
                          description: |-
                            Name of the referent.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          exclusiveMaximum: false
                          exclusiveMinimum: false
                          maxLength: 253
                          minLength: 1
                          type: string
                          uniqueItems: false
                          x-kubernetes-preserve-unknown-fields: false
                      required:
                      - name
                      type: object
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - secretRef
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                enableKubeconfigUpload:
                  default: true
                  description: |-
                    EnableKubeconfigUpload controls whether the automatic kubeconfig upload feature is enabled.
                    Enabling this field only configures the feature; the actual kubeconfig upload is conditional on the
                    kubeconfig ConfigMap.
                    The control plane endpoint is derived from the Cluster object automatically.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: boolean
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            nfd:
              description: NFD tells us to enable or disable the node feature discovery
                addon.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                strategy:
                  default: HelmAddon
                  description: Addon strategy used to deploy Node Feature Discovery
                    (NFD) to the workload cluster.
                  enum:
                  - ClusterResourceSet
                  - HelmAddon
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            registry:
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                provider:
                  default: CNCF Distribution
                  description: The OCI registry provider to deploy.
                  enum:
                  - CNCF Distribution
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              required:
              - provider
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            serviceLoadBalancer:
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                configuration:
                  description: Configuration for the chosen ServiceLoadBalancer provider.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    addressRanges:
                      description: |-
                        AddressRanges is a list of IPv4 address ranges the
                        provider uses to choose an address for a load balancer.
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      items:
                        description: AddressRange defines an IPv4 range.
                        exclusiveMaximum: false
                        exclusiveMinimum: false
                        properties:
                          end:
                            exclusiveMaximum: false
                            exclusiveMinimum: false
                            format: ipv4
                            type: string
                            uniqueItems: false
                            x-kubernetes-preserve-unknown-fields: false
                          start:
                            exclusiveMaximum: false
                            exclusiveMinimum: false
                            format: ipv4
                            type: string
                            uniqueItems: false
                            x-kubernetes-preserve-unknown-fields: false
                        required:
                        - end
                        - start
                        type: object
                        uniqueItems: false
                        x-kubernetes-preserve-unknown-fields: false
                      maxItems: 10
                      minItems: 1
                      type: array
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - addressRanges
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                provider:
                  description: |-
                    The LoadBalancer-type Service provider to deploy. Not required in infrastructures where
                    the CCM acts as the provider.
                  enum:
                  - MetalLB
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
              required:
              - provider
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
          type: object
          uniqueItems: false
          x-kubernetes-preserve-unknown-fields: false
        controlPlane:
          description: NutanixControlPlaneSpec defines the desired state of the control
            plane for a Nutanix cluster.
          exclusiveMaximum: false
          exclusiveMinimum: false
          properties:
            autoRenewCertificates:
              description: |-
                AutoRenewCertificates specifies the configuration for auto-renewing the
                certificates of the control plane.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                daysBeforeExpiry:
                  description: |-
                    DaysBeforeExpiry indicates a rollout needs to be performed if the
                    certificates of the control plane will expire within the specified days.
                    Set to 0 to disable automated certificate renewal.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: Value must be 0 or at least 7
                    rule: self == 0 || self >= 7
              required:
              - daysBeforeExpiry
              type: object
              uniqueItems: false
              x-kubernetes-preserve-unknown-fields: false
            kubeletConfiguration:
              description: |-
                KubeletConfiguration defines kubelet settings for this node group.
                These values apply only to the nodes in this group.
              exclusiveMaximum: false
              exclusiveMinimum: false
              properties:
                automaticReservations:
                  description: |-
                    AutomaticReservations, when set, makes each node compute its kubeReserved
                    resources and a hard eviction threshold at boot from its actual CPU and
                    memory capacity. Mutually exclusive with systemReserved, kubeReserved, and
                    evictionHard.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  properties:
                    profile:
                      description: Profile selects the reservation strategy.
                      enum:
                      - CapacityTiered
                      exclusiveMaximum: false
                      exclusiveMinimum: false
                      type: string
                      uniqueItems: false
                      x-kubernetes-preserve-unknown-fields: false
                  required:
                  - profile
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                containerLogMaxFiles:
                  description: |-
                    ContainerLogMaxFiles specifies the maximum number of container log files
                    that can be present for a container.
                    Default kubelet value is 5.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  minimum: 2
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                containerLogMaxSize:
                  description: |-
                    ContainerLogMaxSize defines the maximum size of the container log file
                    before it is rotated. Value is a quantity (e.g. "10Mi", "256Ki").
                    Default kubelet value is "10Mi".
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                cpuManagerPolicy:
                  description: |-
                    CPUManagerPolicy controls how cpusets are assigned to containers.
                    "static" enables exclusive CPU pinning for Guaranteed QoS pods.
                    Default kubelet value is "none".
                  enum:
                  - none
                  - static
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                enforceNodeAllocatable:
                  description: |-
                    EnforceNodeAllocatable specifies which resource types are enforced via
                    cgroups. When "system-reserved" or "system-reserved-compressible" is
                    included, the kubelet enforces systemReserved limits using the well-known
                    systemd cgroup /system.slice. When "kube-reserved" or
                    "kube-reserved-compressible" is included, the kubelet enforces
                    kubeReserved limits using /system.slice/kubelet.service.
                    The "-compressible" variants enforce only compressible resources (CPU),
                    which is the recommended starting point. "system-reserved" and
                    "system-reserved-compressible" are mutually exclusive, as are
                    "kube-reserved" and "kube-reserved-compressible".
                    Default kubelet behaviour (when this field is not set) is to enforce
                    only pods.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  items:
                    description: EnforceNodeAllocatableOption specifies a resource
                      type for cgroup enforcement.
                    enum:
                    - pods
                    - system-reserved
                    - kube-reserved
                    - system-reserved-compressible
                    - kube-reserved-compressible
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    type: string
                    uniqueItems: false
                    x-kubernetes-preserve-unknown-fields: false
                  maxItems: 3
                  type: array
                  uniqueItems: true
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: system-reserved and system-reserved-compressible are
                      mutually exclusive
                    rule: '!(''system-reserved'' in self && ''system-reserved-compressible''
                      in self)'
                  - message: kube-reserved and kube-reserved-compressible are mutually
                      exclusive
                    rule: '!(''kube-reserved'' in self && ''kube-reserved-compressible''
                      in self)'
                evictionHard:
                  additionalProperties:
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    type: string
                    uniqueItems: false
                    x-kubernetes-preserve-unknown-fields: false
                  description: |-
                    EvictionHard is a map of signal names to quantities that define hard eviction
                    thresholds. When the node reaches these thresholds, pods are evicted immediately
                    with no grace period. Values may be absolute quantities (e.g. "100Mi") or
                    percentages (e.g. "10%").
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  maxProperties: 6
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: only valid eviction signal names are allowed
                    rule: self.all(k, k in ['memory.available', 'nodefs.available',
                      'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree',
                      'pid.available'])
                evictionSoft:
                  additionalProperties:
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    type: string
                    uniqueItems: false
                    x-kubernetes-preserve-unknown-fields: false
                  description: |-
                    EvictionSoft is a map of signal names to quantities that define soft eviction
                    thresholds. Pods are evicted after the grace period specified in
                    evictionSoftGracePeriod has elapsed. Values may be absolute quantities or
                    percentages.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  maxProperties: 6
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: only valid eviction signal names are allowed
                    rule: self.all(k, k in ['memory.available', 'nodefs.available',
                      'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree',
                      'pid.available'])
                evictionSoftGracePeriod:
                  additionalProperties:
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    type: string
                    uniqueItems: false
                    x-kubernetes-preserve-unknown-fields: false
                  description: |-
                    EvictionSoftGracePeriod is a map of signal names to durations that define
                    grace periods for soft eviction signals. Each key must correspond to an entry
                    in evictionSoft.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  maxProperties: 6
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: only valid eviction signal names are allowed
                    rule: self.all(k, k in ['memory.available', 'nodefs.available',
                      'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree',
                      'pid.available'])
                imageGCHighThresholdPercent:
                  description: |-
                    ImageGCHighThresholdPercent is the percent of disk usage after which image
                    garbage collection is always run. Must be greater than
                    imageGCLowThresholdPercent when both are set.
                    Default kubelet value is 85.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  maximum: 100
                  minimum: 0
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                imageGCLowThresholdPercent:
                  description: |-
                    ImageGCLowThresholdPercent is the percent of disk usage before which image
                    garbage collection is never run. Must be less than
                    imageGCHighThresholdPercent when both are set.
                    Default kubelet value is 80.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  maximum: 100
                  minimum: 0
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                kubeReserved:
                  additionalProperties:
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    type: string
                    uniqueItems: false
                    x-kubernetes-preserve-unknown-fields: false
                  description: |-
                    KubeReserved is a set of ResourceName=ResourceQuantity pairs that describe
                    resources reserved for Kubernetes system components (the kubelet, container
                    runtime, etc.).
                    Valid keys: cpu, memory, ephemeral-storage, pid.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  maxProperties: 4
                  type: object
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                  x-kubernetes-validations:
                  - message: only cpu, memory, ephemeral-storage, and pid are valid
                      keys
                    rule: self.all(k, k in ['cpu', 'memory', 'ephemeral-storage',
                      'pid'])
                maxParallelImagePulls:
                  description: |-
                    MaxParallelImagePulls defines the maximum number of image pulls performed
                    in parallel by the kubelet. A value of zero means unlimited. When set to a
                    value > 0, serializeImagePulls is automatically set to false.
                    Default kubelet value is nil (serial pulls).
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  minimum: 0
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                maxPods:
                  description: |-
                    MaxPods defines the maximum number of pods that can run on a node.
                    Default kubelet value is 110.
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  format: int32
                  maximum: 256
                  minimum: 50
                  type: integer
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                memoryManagerPolicy:
                  description: |-
                    MemoryManagerPolicy controls the memory management policy on the node.
                    "Static" enables NUMA-aware memory allocation for Guaranteed QoS pods.
                    Default kubelet value is "None".
                  enum:
                  - None
                  - Static
                  exclusiveMaximum: false
                  exclusiveMinimum: false
                  type: string
                  uniqueItems: false
                  x-kubernetes-preserve-unknown-fields: false
                podPidsLimit:
                  description: |-
                    PodPidsLimit is the maximum number of PIDs in any pod.
                    Prevents fork bombs and enforces per-pod PID limits.
                  exclusiveMaximum: false
