- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.infrastructureRef
    kind: Cluster
    name: golden
    namespace: golden-namespace
  object:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSClusterTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: aws
      name: aws-quick-start
      namespace: golden-namespace
    spec:
      template:
        spec:
          controlPlaneLoadBalancer:
            healthCheckProtocol: HTTPS
            loadBalancerType: nlb
- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.controlPlaneRef
    kind: Cluster
    name: golden
    namespace: golden-namespace
  object:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: KubeadmControlPlaneTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: aws
      name: aws-quick-start-control-plane
      namespace: golden-namespace
    spec:
      template:
        spec:
          kubeadmConfigSpec:
            clusterConfiguration:
              apiServer:
                extraArgs:
                - name: admission-control-config-file
                  value: /etc/kubernetes/admission.yaml
                - name: enable-admission-plugins
                  value: DenyServiceExternalIPs,EventRateLimit,NodeRestriction
                - name: profiling
                  value: "false"
                - name: service-account-lookup
                  value: "true"
                - name: tls-cipher-suites
                  value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
                extraVolumes:
                - hostPath: /etc/kubernetes/admission.yaml
                  mountPath: /etc/kubernetes/admission.yaml
                  name: admission-config
                  pathType: File
                  readOnly: true
                - hostPath: /etc/kubernetes/eventratelimit-config.yaml
                  mountPath: /etc/kubernetes/eventratelimit-config.yaml
                  name: eventratelimit-config
                  pathType: File
                  readOnly: true
              controllerManager:
                extraArgs:
                - name: cloud-provider
                  value: external
                - name: profiling
                  value: "false"
                - name: terminated-pod-gc-threshold
                  value: "10000"
                - name: tls-min-version
                  value: VersionTLS12
              scheduler:
                extraArgs:
                - name: profiling
                  value: "false"
                - name: tls-min-version
                  value: VersionTLS12
            files:
            - content: |
                apiVersion: kubelet.config.k8s.io/v1beta1
                kind: KubeletConfiguration
                evictionHard:
                  nodefs.available: "10%"
                  nodefs.inodesFree: "5%"
                  imagefs.available: "15%"
                  memory.available: "100Mi"
                  imagefs.inodesFree: "10%"
              path: /etc/kubernetes/patches/kubeletconfiguration0+strategic.json
              permissions: "0600"
            - content: |
                apiVersion: kubelet.config.k8s.io/v1beta1
                kind: KubeletConfiguration
                # 4.2.4 Ensure that the --read-only-port argument is set to 0
                readOnlyPort: 0
                # 4.2.5 Ensure that the --streaming-connection-idle-timeout argument is not set to 0
                # Recommendation: Set to 5m instead of 4h as per CIS guidelines
                streamingConnectionIdleTimeout: "5m"
                # 4.2.8 Ensure that the event-qps argument is set to a level which ensures appropriate event capture
                eventRecordQPS: 5
                # 4.2.12 Updated with recommended strong cipher suites
                tlsCipherSuites: [TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384]
                # 4.2.13 Ensure that a limit is set on pod PIDs
                podPidsLimit: 4096
              path: /etc/kubernetes/patches/kubeletconfiguration1+strategic.json
              permissions: "0600"
            - content: |
                apiVersion: apiserver.config.k8s.io/v1
                kind: AdmissionConfiguration
                plugins:
                - name: EventRateLimit
                  path: /etc/kubernetes/eventratelimit-config.yaml
              path: /etc/kubernetes/admission.yaml
              permissions: "0600"
            - content: |
                apiVersion: eventratelimit.admission.k8s.io/v1alpha1
                kind: Configuration
                limits:
                - type: Server
                  qps: 10000
                  burst: 40000
              path: /etc/kubernetes/eventratelimit-config.yaml
              permissions: "0600"
            initConfiguration:
              nodeRegistration:
                kubeletExtraArgs:
                - name: cloud-provider
                  value: external
                name: '{{ ds.meta_data.local_hostname }}'
              patches:
                directory: /etc/kubernetes/patches
            joinConfiguration:
              nodeRegistration:
                kubeletExtraArgs:
                - name: cloud-provider
                  value: external
                name: '{{ ds.meta_data.local_hostname }}'
              patches:
                directory: /etc/kubernetes/patches
            postKubeadmCommands:
            - chmod 600 "$(systemctl show -P FragmentPath kubelet.service)"
            - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
            - chmod 600 /var/lib/kubelet/config.yaml
- holderRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    fieldPath: spec.machineTemplate.spec.infrastructureRef
    kind: KubeadmControlPlane
    name: golden
    namespace: golden-namespace
  object:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSMachineTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: aws
      name: aws-quick-start-control-plane
      namespace: golden-namespace
    spec:
      template:
        spec:
          instanceType: PLACEHOLDER
          sshKeyName: ""
- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.template.spec.bootstrap.configRef
    kind: MachineDeployment
    name: golden-md-0
    namespace: golden-namespace
  object:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: aws
      name: aws-quick-start-worker-bootstraptemplate
      namespace: golden-namespace
    spec:
      template:
        spec:
          files:
          - content: |
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              evictionHard:
                nodefs.available: "10%"
                nodefs.inodesFree: "5%"
                imagefs.available: "15%"
                memory.available: "100Mi"
                imagefs.inodesFree: "10%"
            path: /etc/kubernetes/patches/kubeletconfiguration0+strategic.json
            permissions: "0600"
          - content: |
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              # 4.2.4 Ensure that the --read-only-port argument is set to 0
              readOnlyPort: 0
              # 4.2.5 Ensure that the --streaming-connection-idle-timeout argument is not set to 0
              # Recommendation: Set to 5m instead of 4h as per CIS guidelines
              streamingConnectionIdleTimeout: "5m"
              # 4.2.8 Ensure that the event-qps argument is set to a level which ensures appropriate event capture
              eventRecordQPS: 5
              # 4.2.12 Updated with recommended strong cipher suites
              tlsCipherSuites: [TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384]
              # 4.2.13 Ensure that a limit is set on pod PIDs
              podPidsLimit: 4096
            path: /etc/kubernetes/patches/kubeletconfiguration1+strategic.json
            permissions: "0600"
          - content: |
              #!/bin/bash
              set -euo pipefail

              # This script is used to discover the placement group for the node.
              # The script will be placed in /etc/kubernetes/node-feature-discovery/source.d/
              # The script will be executed by the node feature discovery's local feature hook.
              PLACEMENT_GROUP_FEATURE_DIR="/etc/kubernetes/node-feature-discovery/features.d"
              PLACEMENT_GROUP_FEATURE_FILE="${PLACEMENT_GROUP_FEATURE_DIR}/placementgroup"
              # Fetch IMDSv2 token
              TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
                -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

              # Get placement info with HTTP status check
              PARTITION_RESPONSE=$(curl -s -w "%{http_code}" -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/placement/partition-number)

              PG_RESPONSE=$(curl -s -w "%{http_code}" -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/placement/group-name)

              # Extract HTTP status codes and content
              PARTITION_HTTP_CODE="${PARTITION_RESPONSE: -3}" # last 3 characters are the HTTP status code
              PARTITION_CONTENT="${PARTITION_RESPONSE%???}"   # remove the last 3 characters to get the content

              mkdir -p "${PLACEMENT_GROUP_FEATURE_DIR}"
              touch "${PLACEMENT_GROUP_FEATURE_FILE}"

              # Only print features if HTTP 200 response
              if [ "$PARTITION_HTTP_CODE" = "200" ] && [ -n "$PARTITION_CONTENT" ]; then
                echo "feature.node.kubernetes.io/partition=${PARTITION_CONTENT}" >>"${PLACEMENT_GROUP_FEATURE_FILE}"
              fi

              PG_HTTP_CODE="${PG_RESPONSE: -3}" # last 3 characters are the HTTP status code
              PG_CONTENT="${PG_RESPONSE%???}"   # remove the last 3 characters to get the content

              if [ "$PG_HTTP_CODE" = "200" ] && [ -n "$PG_CONTENT" ]; then
                echo "feature.node.kubernetes.io/aws-placement-group=${PG_CONTENT}" >>"${PLACEMENT_GROUP_FEATURE_FILE}"
              fi
            path: /etc/kubernetes/node-feature-discovery/source.d/placementgroup_discovery.sh
            permissions: "0700"
          - content: |
              ---
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              maxPods: 120
            owner: root:root
            path: /etc/kubernetes/patches/kubeletconfiguration99+strategic.json
            permissions: "0644"
          joinConfiguration:
            nodeRegistration:
              ignorePreflightErrors:
              - SystemVerification
              kubeletExtraArgs:
              - name: cloud-provider
                value: external
              name: '{{ ds.meta_data.local_hostname }}'
              taints:
              - effect: NoSchedule
                key: golden-key
                value: golden-value
            patches:
              directory: /etc/kubernetes/patches
          postKubeadmCommands:
          - chmod 600 "$(systemctl show -P FragmentPath kubelet.service)"
          - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
          - chmod 600 /var/lib/kubelet/config.yaml
          preKubeadmCommands:
          - /etc/kubernetes/node-feature-discovery/source.d/placementgroup_discovery.sh
- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.template.spec.infrastructureRef
    kind: MachineDeployment
    name: golden-md-0
    namespace: golden-namespace
  object:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSMachineTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: aws
      name: aws-quick-start-worker-machinetemplate
      namespace: golden-namespace
    spec:
      template:
        spec:
          additionalSecurityGroups:
          - id: sg-0123456789abcdef0
          additionalTags:
            NodeType: worker
          iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
          instanceType: m5.2xlarge
          placementGroupName: golden-worker-pg
          rootVolume:
            size: 200
            type: gp3
          sshKeyName: ""
