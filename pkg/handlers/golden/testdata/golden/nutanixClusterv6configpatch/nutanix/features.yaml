- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.infrastructureRef
    kind: Cluster
    name: golden
    namespace: golden-namespace
  object:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: NutanixClusterTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: nutanix
      name: nutanix-quick-start-nct
      namespace: golden-namespace
    spec:
      template:
        spec:
          controlPlaneEndpoint:
            host: 192.0.2.10
            port: 6443
          prismCentral:
            address: prism-central.example.com
            credentialRef:
              kind: Secret
              name: golden-pc-creds
              namespace: golden-namespace
            port: 9440
- holderRef:
    apiVersion: cluster.x-k8s.io/v1beta2
    fieldPath: spec.controlPlaneRef
    kind: Cluster
    name: golden
    namespace: golden-namespace
  object:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: KubeadmControlPlaneTemplate
    metadata:
      labels:
        cluster.x-k8s.io/provider: nutanix
      name: nutanix-quick-start-kcpt
      namespace: golden-namespace
    spec:
      template:
        spec:
          kubeadmConfigSpec:
            clusterConfiguration:
              apiServer:
                certSANs:
                - api.example.com
                extraArgs:
                - name: admission-control-config-file
                  value: /etc/kubernetes/admission.yaml
                - name: audit-log-compress
                  value: "true"
                - name: audit-log-maxage
                  value: "30"
                - name: audit-log-maxbackup
                  value: "90"
                - name: audit-log-maxsize
                  value: "100"
                - name: audit-log-path
                  value: /var/log/audit/kube-apiserver-audit.log
                - name: audit-policy-file
                  value: /etc/kubernetes/audit-policy.yaml
                - name: cloud-provider
                  value: external
                - name: enable-admission-plugins
                  value: DenyServiceExternalIPs,EventRateLimit,NodeRestriction,PodSecurity
                - name: profiling
                  value: "false"
                - name: service-account-lookup
                  value: "true"
                - name: tls-cipher-suites
                  value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
                extraVolumes:
                - hostPath: /etc/kubernetes/admission.yaml
                  mountPath: /etc/kubernetes/admission.yaml
                  name: admission-config
                  pathType: File
                  readOnly: true
                - hostPath: /etc/kubernetes/eventratelimit-config.yaml
                  mountPath: /etc/kubernetes/eventratelimit-config.yaml
                  name: eventratelimit-config
                  pathType: File
                  readOnly: true
                - hostPath: /etc/kubernetes/audit-policy.yaml
                  mountPath: /etc/kubernetes/audit-policy.yaml
                  name: audit-policy
                  pathType: File
                  readOnly: true
                - hostPath: /var/log/kubernetes/audit
                  mountPath: /var/log/audit/
                  name: audit-logs
                  pathType: DirectoryOrCreate
                - hostPath: /etc/kubernetes/pod-security-admission.yaml
                  mountPath: /etc/kubernetes/pod-security-admission.yaml
                  name: podsecurity-config
                  pathType: File
                  readOnly: true
              controllerManager:
                extraArgs:
                - name: cloud-provider
                  value: external
                - name: profiling
                  value: "false"
                - name: terminated-pod-gc-threshold
                  value: "10000"
                - name: tls-cipher-suites
                  value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
                - name: tls-min-version
                  value: VersionTLS12
              etcd:
                local:
                  extraArgs:
                  - name: auto-tls
                    value: "false"
                  - name: cipher-suites
                    value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
                  - name: peer-auto-tls
                    value: "false"
                  - name: tls-min-version
                    value: TLS1.2
              imageRepository: registry.example.com/kubernetes
              scheduler:
                extraArgs:
                - name: profiling
                  value: "false"
                - name: tls-cipher-suites
                  value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
                - name: tls-min-version
                  value: VersionTLS12
            files:
            - content: |
                apiVersion: kubelet.config.k8s.io/v1beta1
                kind: KubeletConfiguration
                evictionHard:
                  nodefs.available: "10%"
                  nodefs.inodesFree: "5%"
                  imagefs.available: "15%"
                  memory.available: "100Mi"
                  imagefs.inodesFree: "10%"
              path: /etc/kubernetes/patches/kubeletconfiguration0+strategic.json
              permissions: "0600"
            - content: |
                apiVersion: kubelet.config.k8s.io/v1beta1
                kind: KubeletConfiguration
                # 4.2.4 Ensure that the --read-only-port argument is set to 0
                readOnlyPort: 0
                # 4.2.5 Ensure that the --streaming-connection-idle-timeout argument is not set to 0
                # Recommendation: Set to 5m instead of 4h as per CIS guidelines
                streamingConnectionIdleTimeout: "5m"
                # 4.2.8 Ensure that the event-qps argument is set to a level which ensures appropriate event capture
                eventRecordQPS: 5
                # 4.2.12 Updated with recommended strong cipher suites
                tlsCipherSuites: [TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384]
                # 4.2.13 Ensure that a limit is set on pod PIDs
                podPidsLimit: 4096
              path: /etc/kubernetes/patches/kubeletconfiguration1+strategic.json
              permissions: "0600"
            - content: |
                apiVersion: apiserver.config.k8s.io/v1
                kind: AdmissionConfiguration
                plugins:
                - name: EventRateLimit
                  path: /etc/kubernetes/eventratelimit-config.yaml
                - name: PodSecurity
                  path: /etc/kubernetes/pod-security-admission.yaml
              path: /etc/kubernetes/admission.yaml
              permissions: "0600"
            - content: |
                apiVersion: eventratelimit.admission.k8s.io/v1alpha1
                kind: Configuration
                limits:
                - type: Server
                  qps: 10000
                  burst: 40000
              path: /etc/kubernetes/eventratelimit-config.yaml
              permissions: "0600"
            - content: |
                # Taken from https://github.com/kubernetes/kubernetes/blob/v1.28.1/cluster/gce/gci/configure-helper.sh#L1101
                # Recommended in Kubernetes docs
                apiVersion: audit.k8s.io/v1
                kind: Policy
                rules:
                # The following requests were manually identified as high-volume and low-risk,
                # so drop them.
                - level: None
                  users: ["system:kube-proxy"]
                  verbs: ["watch"]
                  resources:
                    - group: "" # core
                      resources: ["endpoints", "services", "services/status"]
                - level: None
                  # Ingress controller reads 'configmaps/ingress-uid' through the unsecured port.
                  # TODO(#46983): Change this to the ingress controller service account.
                  users: ["system:unsecured"]
                  namespaces: ["kube-system"]
                  verbs: ["get"]
                  resources:
                    - group: "" # core
                      resources: ["configmaps"]
                - level: None
                  users: ["kubelet"] # legacy kubelet identity
                  verbs: ["get"]
                  resources:
                    - group: "" # core
                      resources: ["nodes", "nodes/status"]
                - level: None
                  userGroups: ["system:nodes"]
                  verbs: ["get"]
                  resources:
                    - group: "" # core
                      resources: ["nodes", "nodes/status"]
                - level: None
                  users:
                    - system:kube-controller-manager
                    - system:cloud-controller-manager
                    - system:kube-scheduler
                    - system:serviceaccount:kube-system:endpoint-controller
                  verbs: ["get", "update"]
                  namespaces: ["kube-system"]
                  resources:
                    - group: "" # core
                      resources: ["endpoints"]
                - level: None
                  users: ["system:apiserver"]
                  verbs: ["get"]
                  resources:
                    - group: "" # core
                      resources: ["namespaces", "namespaces/status", "namespaces/finalize"]
                - level: None
                  users: ["cluster-autoscaler"]
                  verbs: ["get", "update"]
                  namespaces: ["kube-system"]
                  resources:
                    - group: "" # core
                      resources: ["configmaps", "endpoints"]
                # Don't log HPA fetching metrics.
                - level: None
                  users:
                    - system:kube-controller-manager
                    - system:cloud-controller-manager
                  verbs: ["get", "list"]
                  resources:
                    - group: "metrics.k8s.io"

                # Don't log these read-only URLs.
                - level: None
                  nonResourceURLs:
                    - /healthz*
                    - /version
                    - /swagger*

                # Don't log events requests because of performance impact.
                - level: None
                  resources:
                    - group: "" # core
                      resources: ["events"]

                # node and pod status calls from nodes are high-volume and can be large, don't log responses for expected updates from nodes
                - level: Request
                  users: ["kubelet", "system:node-problem-detector", "system:serviceaccount:kube-system:node-problem-detector"]
                  verbs: ["update","patch"]
                  resources:
                    - group: "" # core
                      resources: ["nodes/status", "pods/status"]
                  omitStages:
                    - "RequestReceived"
                - level: Request
                  userGroups: ["system:nodes"]
                  verbs: ["update","patch"]
                  resources:
                    - group: "" # core
                      resources: ["nodes/status", "pods/status"]
                  omitStages:
                    - "RequestReceived"

                # deletecollection calls can be large, don't log responses for expected namespace deletions
                - level: Request
                  users: ["system:serviceaccount:kube-system:namespace-controller"]
                  verbs: ["deletecollection"]
                  omitStages:
                    - "RequestReceived"

                # Secrets, ConfigMaps, TokenRequest and TokenReviews can contain sensitive & binary data,
                # so only log at the Metadata level.
                - level: Metadata
                  resources:
                    - group: "" # core
                      resources: ["secrets", "configmaps", "serviceaccounts/token"]
                    - group: authentication.k8s.io
                      resources: ["tokenreviews"]
                  omitStages:
                    - "RequestReceived"
                # Get responses can be large; skip them.
                - level: Request
                  verbs: ["get", "list", "watch"]
                  resources:
                    - group: "" # core
                    - group: "admissionregistration.k8s.io"
                    - group: "apiextensions.k8s.io"
                    - group: "apiregistration.k8s.io"
                    - group: "apps"
                    - group: "authentication.k8s.io"
                    - group: "authorization.k8s.io"
                    - group: "autoscaling"
                    - group: "batch"
                    - group: "certificates.k8s.io"
                    - group: "extensions"
                    - group: "metrics.k8s.io"
                    - group: "networking.k8s.io"
                    - group: "node.k8s.io"
                    - group: "policy"
                    - group: "rbac.authorization.k8s.io"
                    - group: "scheduling.k8s.io"
                    - group: "storage.k8s.io"
                  omitStages:
                    - "RequestReceived"
                # Default level for known APIs
                - level: RequestResponse
                  resources:
                    - group: "" # core
                    - group: "admissionregistration.k8s.io"
                    - group: "apiextensions.k8s.io"
                    - group: "apiregistration.k8s.io"
                    - group: "apps"
                    - group: "authentication.k8s.io"
                    - group: "authorization.k8s.io"
                    - group: "autoscaling"
                    - group: "batch"
                    - group: "certificates.k8s.io"
                    - group: "extensions"
                    - group: "metrics.k8s.io"
                    - group: "networking.k8s.io"
                    - group: "node.k8s.io"
                    - group: "policy"
                    - group: "rbac.authorization.k8s.io"
                    - group: "scheduling.k8s.io"
                    - group: "storage.k8s.io"
                  omitStages:
                    - "RequestReceived"
                # Default level for all other requests.
                - level: Metadata
                  omitStages:
                    - "RequestReceived"
              path: /etc/kubernetes/audit-policy.yaml
              permissions: "0600"
            - content: |
                [Service]
                Environment="HTTP_PROXY=http://proxy.example.com"
                Environment="http_proxy=http://proxy.example.com"
                Environment="HTTPS_PROXY=http://proxy.example.com"
                Environment="https_proxy=http://proxy.example.com"
                Environment="NO_PROXY=localhost,127.0.0.1,kubernetes,kubernetes.default,.svc,.svc.cluster.local,.svc.cluster.local.,no-proxy.example.com"
                Environment="no_proxy=localhost,127.0.0.1,kubernetes,kubernetes.default,.svc,.svc.cluster.local,.svc.cluster.local.,no-proxy.example.com"
              owner: root
              path: /etc/systemd/system/containerd.service.d/http-proxy.conf
              permissions: "0640"
            - content: |
                [Service]
                Environment="HTTP_PROXY=http://proxy.example.com"
                Environment="http_proxy=http://proxy.example.com"
                Environment="HTTPS_PROXY=http://proxy.example.com"
                Environment="https_proxy=http://proxy.example.com"
                Environment="NO_PROXY=localhost,127.0.0.1,kubernetes,kubernetes.default,.svc,.svc.cluster.local,.svc.cluster.local.,no-proxy.example.com"
                Environment="no_proxy=localhost,127.0.0.1,kubernetes,kubernetes.default,.svc,.svc.cluster.local,.svc.cluster.local.,no-proxy.example.com"
              owner: root
              path: /etc/systemd/system/kubelet.service.d/http-proxy.conf
              permissions: "0640"
            - content: |
                #!/bin/bash
                set -euo pipefail
                IFS=$'\n\t'

                declare -r CREDENTIAL_PROVIDER_IMAGE="ghcr.io/mesosphere/dynamic-credential-provider:v0.5.3"

                if ! ctr --namespace k8s.io images check "name==${CREDENTIAL_PROVIDER_IMAGE}" | grep "${CREDENTIAL_PROVIDER_IMAGE}" >/dev/null; then
                  ctr --namespace k8s.io images pull "${CREDENTIAL_PROVIDER_IMAGE}"
                fi

                cleanup() {
                  ctr images unmount "${tmp_ctr_mount_dir}" || true
                }

                trap 'cleanup' EXIT

                readonly tmp_ctr_mount_dir="$(mktemp -d)"

                export CREDENTIAL_PROVIDER_SOURCE_DIR="${tmp_ctr_mount_dir}/opt/image-credential-provider/bin/"
                export CREDENTIAL_PROVIDER_TARGET_DIR="/etc/kubernetes/image-credential-provider/"

                ctr --namespace k8s.io images mount "${CREDENTIAL_PROVIDER_IMAGE}" "${tmp_ctr_mount_dir}"
                "${tmp_ctr_mount_dir}/opt/image-credential-provider/bin/dynamic-credential-provider" install
              path: /etc/caren/install-kubelet-credential-providers.sh
              permissions: "0700"
            - content: |
                apiVersion: kubelet.config.k8s.io/v1
                kind: CredentialProviderConfig
                providers:
                - name: dynamic-credential-provider
                  args:
                  - get-credentials
                  - -c
                  - /etc/kubernetes/dynamic-credential-provider-config.yaml
                  matchImages:
                  - "registry.example.com"
                  - "*"
                  - "*.*"
                  - "*.*.*"
                  - "*.*.*.*"
                  - "*.*.*.*.*"
                  - "*.*.*.*.*.*"
                  defaultCacheDuration: "0s"
                  apiVersion: credentialprovider.kubelet.k8s.io/v1
              path: /etc/kubernetes/image-credential-provider-config.yaml
              permissions: "0600"
            - content: |
                apiVersion: credentialprovider.d2iq.com/v1alpha1
                kind: DynamicCredentialProviderConfig
                credentialProviderPluginBinDir: /etc/kubernetes/image-credential-provider/
                credentialProviders:
                  apiVersion: kubelet.config.k8s.io/v1
                  kind: CredentialProviderConfig
                  providers:
                  - name: static-credential-provider
                    args:
                    - /etc/kubernetes/static-image-credentials.json
                    matchImages:
                    - "registry.example.com"
                    defaultCacheDuration: "0s"
                    apiVersion: credentialprovider.kubelet.k8s.io/v1
              path: /etc/kubernetes/dynamic-credential-provider-config.yaml
              permissions: "0600"
            - contentFrom:
                secret:
                  key: static-credential-provider
                  name: golden-static-credential-provider-response
              path: /etc/kubernetes/static-image-credentials.json
              permissions: "0600"
            - content: |
                [host."https://mirror.example.com/v2"]
                  capabilities = ["pull", "resolve"]
                  # don't rely on Containerd to add the v2/ suffix
                  # there is a bug where it is added incorrectly for mirrors with a path
                  override_path = true
              path: /etc/containerd/certs.d/_default/hosts.toml
              permissions: "0600"
            - content: |
                [plugins."io.containerd.grpc.v1.cri".registry]
                  config_path = "/etc/containerd/certs.d"
                [plugins."io.containerd.cri.v1.images".registry]
                  config_path = "/etc/containerd/certs.d"
              path: /etc/caren/containerd/patches/registry-config.toml
              permissions: "0600"
            - content: |
                [metrics]
                  address = "0.0.0.0:1338"
                  grpc_histogram = false
              path: /etc/caren/containerd/patches/metrics-config.toml
              permissions: "0600"
            - content: |
                [plugins."io.containerd.grpc.v1.cri"]
                  enable_unprivileged_ports = true
                  enable_unprivileged_icmp = true
              path: /etc/caren/containerd/patches/unprivileged-ports-config.toml
              permissions: "0600"
            - content: |
                ---
                apiVersion: kubeproxy.config.k8s.io/v1alpha1
                kind: KubeProxyConfiguration
                mode: nftables
              owner: root:root
              path: /etc/kubernetes/kubeproxy-config.yaml
              permissions: "0644"
            - content: |
                apiVersion: pod-security.admission.config.k8s.io/v1
                kind: PodSecurityConfiguration
                defaults:
                  enforce: "restricted"
                  enforce-version: "latest"
                  audit: "restricted"
                  audit-version: "latest"
                  warn: "restricted"
                  warn-version: "latest"
                exemptions:
                  namespaces:
                    - "kube-system"
              path: /etc/kubernetes/pod-security-admission.yaml
              permissions: "0600"
            - content: |
                #!/bin/bash
                set -euo pipefail
                IFS=$'\n\t'

                # This script is used to merge the TOML files in the patch directory into the containerd configuration file.

                # Check if there are any TOML files in the patch directory, exiting if none are found.
                # Use a for loop that will only run a maximum of once to check if there are any files in the patch directory because
                # using -e does not work with globs.
                # See https://github.com/koalaman/shellcheck/wiki/SC2144 for an explanation of the following loop.
                patches_exist=false
                for file in "/etc/caren/containerd/patches"/*.toml; do
                  if [ -e "${file}" ]; then
                    patches_exist=true
                  fi
                  # Always break after the first iteration.
                  break
                done

                if [ "${patches_exist}" = false ]; then
                  echo "No TOML files found in the patch directory: /etc/caren/containerd/patches - nothing to do"
                  exit 0
                fi

                # Use go template variable to avoid hard-coding the toml-merge image name in this script.
                declare -r TOML_MERGE_IMAGE="ghcr.io/mesosphere/toml-merge:v0.2.0"

                # Check if the toml-merge image is already present in ctr images list, if not pull it.
                if ! ctr --namespace k8s.io images check "name==${TOML_MERGE_IMAGE}" | grep "${TOML_MERGE_IMAGE}" >/dev/null; then
                  ctr --namespace k8s.io images pull "${TOML_MERGE_IMAGE}"
                fi

                # Cleanup the temporary directory on exit.
                cleanup() {
                  ctr images unmount "${tmp_ctr_mount_dir}" || true
                }
                trap 'cleanup' EXIT

                # Create a temporary directory to mount the toml-merge image filesystem.
                readonly tmp_ctr_mount_dir="$(mktemp -d)"

                # Mount the toml-merge image filesystem and run the toml-merge binary to merge the TOML files.
                ctr --namespace k8s.io images mount "${TOML_MERGE_IMAGE}" "${tmp_ctr_mount_dir}"
                "${tmp_ctr_mount_dir}/usr/local/bin/toml-merge" -i --patch-file "/etc/caren/containerd/patches/*.toml" /etc/containerd/config.toml
              path: /etc/caren/containerd/apply-patches.sh
              permissions: "0700"
            - content: |
                #!/bin/bash
                if [ "$(systemctl show containerd -p NeedDaemonReload --value)" == "yes" ]; then
                  systemctl daemon-reload
                fi
                systemctl restart containerd

                if ! command -v crictl; then
                  echo "Command crictl is not available, will not wait for Containerd to be running"
                  exit
                fi

                SECONDS=0
                until crictl info; do
                  if ((SECONDS > 60)); then
                    echo "Containerd is not running. Giving up..."
                    exit 1
                  fi
                  echo "Containerd is not running yet. Waiting..."
                  sleep 5
                done
              path: /etc/caren/containerd/restart.sh
              permissions: "0700"
            - content: |
                ---
                apiVersion: kubelet.config.k8s.io/v1beta1
                kind: KubeletConfiguration
                maxPods: 120
              owner: root:root
              path: /etc/kubernetes/patches/kubeletconfiguration99+strategic.json
              permissions: "0644"
            initConfiguration:
              nodeRegistration:
                ignorePreflightErrors:
                - SystemVerification
                kubeletExtraArgs:
                - name: cloud-provider
                  value: external
                - name: image-credential-provider-bin-dir
                  value: /etc/kubernetes/image-credential-provider/
                - name: image-credential-provider-config
                  value: /etc/kubernetes/image-credential-provider-config.yaml
                taints:
                - effect: NoSchedule
                  key: golden-key
                  value: golden-value
              patches:
                directory: /etc/kubernetes/patches
            joinConfiguration:
              nodeRegistration:
                ignorePreflightErrors:
                - SystemVerification
                kubeletExtraArgs:
                - name: cloud-provider
                  value: external
                - name: image-credential-provider-bin-dir
                  value: /etc/kubernetes/image-credential-provider/
                - name: image-credential-provider-config
                  value: /etc/kubernetes/image-credential-provider-config.yaml
                taints:
                - effect: NoSchedule
                  key: golden-key
                  value: golden-value
              patches:
                directory: /etc/kubernetes/patches
            ntp:
              enabled: true
              servers:
              - time.example.com
            postKubeadmCommands:
            - chmod 600 "$(systemctl show -P FragmentPath kubelet.service)"
            - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
            - chmod 600 /var/lib/kubelet/config.yaml
            preKubeadmCommands:
            - echo "before kubeadm call" > /var/log/prekubeadm.log
            - hostnamectl set-hostname "{{ ds.meta_data.hostname }}"
            - echo "::1         ipv6-localhost ipv6-loopback" >/etc/hosts
            - echo "127.0.0.1   localhost" >>/etc/hosts
            - echo "127.0.0.1   {{ ds.meta_data.hostname }}" >> /etc/hosts
            - /bin/bash /etc/caren/install-kubelet-credential-providers.sh
            - '/bin/sh -ec ''(grep -q "^kind: KubeProxyConfiguration$" /run/kubeadm/kubeadm.yaml
              && sed -i -e "s/^\(kind: KubeProxyConfiguration\)$/\1\nmode: nftables/"
              /run/kubeadm/kubeadm.yaml) || (cat /etc/kubernetes/kubeproxy-config.yaml
              >>/run/kubeadm/kubeadm.yaml)'''
            - /bin/bash /etc/caren/containerd/apply-patches.sh
            - /bin/bash /etc/caren/containerd/restart.sh
            users:
            - lockPassword: true
              name: golden
              sshAuthorizedKeys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAua0lo8BiGWgvIiDCKnQDKL5uERHfnehm0ns5CEJpJw
                golden
              sudo: ALL=(ALL) NOPASSWD:ALL
            verbosity: 10
          rollout:
            before:
              certificatesExpiryDays: 30
