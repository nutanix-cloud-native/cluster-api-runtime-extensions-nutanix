          - chmod 600 $(systemctl show -P DropInPaths kubelet.service)
          - chmod 600 /var/lib/kubelet/config.yaml
          preKubeadmCommands:
          - echo "before kubeadm call" > /var/log/prekubeadm.log
          - hostnamectl set-hostname "{{ ds.meta_data.hostname }}"
          - /bin/bash /etc/caren/install-kubelet-credential-providers.sh
          - /bin/bash /etc/caren/containerd/apply-patches.sh
          - /bin/bash /etc/caren/containerd/restart.sh
          users:
          - lockPassword: true
            name: golden
            sshAuthorizedKeys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAua0lo8BiGWgvIiDCKnQDKL5uERHfnehm0ns5CEJpJw
              golden
            sudo: ALL=(ALL) NOPASSWD:ALL
          verbosity: 10
