# Sources the CAPX and CCM Prism Central credentials from a project-scoped user
# instead of the broad-scope one. Project-scoped users authenticate with
# username/password, so this is always basic_auth.
- op: replace
  path: /stringData/credentials
  value: |
    [
      {
        "type": "basic_auth",
        "data": {
          "prismCentral": {
            "username": "${NUTANIX_PROJECT_SCOPE_USER}",
            "password": "${NUTANIX_PROJECT_SCOPE_PASSWORD}"
          }
        }
      }
    ]
