- op: replace
  path: /stringData/host
  value: ${NUTANIX_ENDPOINT}
- op: replace
  path: /stringData/port
  value: ${NUTANIX_PORT}
- op: replace
  path: /stringData/auth_type
  value: service-auth
- op: replace
  path: /stringData/key_type
  value: api-key
- op: replace
  path: /stringData/key_value
  value: ${NUTANIX_API_KEY}
- op: remove
  path: /stringData/key
