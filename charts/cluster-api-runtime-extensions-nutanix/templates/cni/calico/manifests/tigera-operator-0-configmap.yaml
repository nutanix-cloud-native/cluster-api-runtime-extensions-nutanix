re allowed within GatewayClassSpec.","items":{"properties":{"envoyProxyRef":{"description":"Reference to a custom EnvoyProxy resource to use as the base EnvoyProxy configuration for\nthis GatewayClass.  When specified, must identify an EnvoyProxy resource.\nWhen not specified, the Tigera operator uses an empty EnvoyProxy resource as its base.\nStarting from that base, the Tigera operator copies and modifies the EnvoyProxy resource\nas follows, in the order described:\n1. It configures the `tigera/envoy-proxy` image that will be used (according to the\ncurrent Calico version, private registry and image set settings) and any pull secrets\nthat are needed to pull that image.\n2. It applies customizations as specified by the following `GatewayKind`,\n`GatewayDeployment`, `GatewayDaemonSet` and `GatewayService` fields.\nThe resulting EnvoyProxy is provisioned in the `tigera-gateway` namespace, together with\na GatewayClass that references it.\nIf a custom EnvoyProxy resource is specified and uses `EnvoyDaemonSet` instead of the\ndefault `EnvoyDeployment`, deployment-related customizations will be applied within\n`EnvoyDaemonSet` instead of within `EnvoyDeployment`.","properties":{"name":{"type":"string"},"namespace":{"type":"string"}},"required":["name","namespace"],"type":"object"},"gatewayDaemonSet":{"description":"Allows customization of Gateways when deployed as Kubernetes DaemonSets, for Gateways in\nthis GatewayClass.","properties":{"spec":{"description":"GatewayDeploymentSpec allows customization of the spec of gateway daemonsets.","properties":{"template":{"description":"GatewayDeploymentPodTemplate allows customization of the pod template of gateway daemonsets.","properties":{"metadata":{"description":"If non-nil, non-clashing labels and annotations from this metadata are added into each\ndaemonset's pod template.","properties":{"annotations":{"additionalProperties":{"type":"string"},"description":"Annotations is a map of arbitrary non-identifying metadata. Each