ng":true},"description":"Limits describes the maximum amount of compute resources allowed.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","type":"object"},"requests":{"additionalProperties":{"anyOf":[{"type":"integer"},{"type":"string"}],"pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true},"description":"Requests describes the minimum amount of compute resources required.\nIf Requests is omitted for a container, it defaults to Limits if that is explicitly specified,\notherwise to an implementation-defined value. Requests cannot exceed Limits.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","type":"object"}},"type":"object"}},"required":["name"],"type":"object"},"type":"array"},"nodeSelector":{"additionalProperties":{"type":"string"},"description":"NodeSelector is the csi-node-driver pod's scheduling constraints.\nIf specified, each of the key/value pairs are added to the csi-node-driver DaemonSet nodeSelector provided\nthe key does not already exist in the object's nodeSelector.\nIf omitted, the csi-node-driver DaemonSet will use its default value for nodeSelector.\nWARNING: Please note that this field will modify the default csi-node-driver DaemonSet nodeSelector.","type":"object"},"tolerations":{"description":"Tolerations is the csi-node-driver pod's tolerations.\nIf specified, this overrides any tolerations that may be set on the csi-node-driver DaemonSet.\nIf omitted, the csi-node-driver DaemonSet will use its default value for tolerations.\nWARNING: Please note that this field will override the default csi-node-driver DaemonSet tolerations.","items":{"description":"The pod this Toleration is attached to tolerates any taint that matches\nthe triple <key,value,effect> using the matching operator <operator>.","properties":{"effect":{"description":"Effect indicates 