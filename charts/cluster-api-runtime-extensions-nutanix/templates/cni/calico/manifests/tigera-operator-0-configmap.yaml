ainer.\nThis field depends on the\nDynamicResourceAllocation feature gate.\nThis field is immutable. It can only be set for containers.","items":{"description":"ResourceClaim references one entry in PodSpec.ResourceClaims.","properties":{"name":{"description":"Name must match the name of one entry in pod.spec.resourceClaims of\nthe Pod where this field is used. It makes that resource available\ninside a container.","type":"string"},"request":{"description":"Request is the name chosen for a request in the referenced claim.\nIf empty, everything from the claim is made available, otherwise\nonly the result of this request.","type":"string"}},"required":["name"],"type":"object"},"type":"array","x-kubernetes-list-map-keys":["name"],"x-kubernetes-list-type":"map"},"limits":{"additionalProperties":{"anyOf":[{"type":"integer"},{"type":"string"}],"pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true},"description":"Limits describes the maximum amount of compute resources allowed.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","type":"object"},"requests":{"additionalProperties":{"anyOf":[{"type":"integer"},{"type":"string"}],"pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true},"description":"Requests describes the minimum amount of compute resources required.\nIf Requests is omitted for a container, it defaults to Limits if that is explicitly specified,\notherwise to an implementation-defined value. Requests cannot exceed Limits.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","type":"object"}},"type":"object"}},"required":["name"],"type":"object"},"type":"array"},"nodeSelector":{"additionalProperties":{"type":"string"},"description":"NodeSelector is the calico-kube-controllers pod's scheduling constraints.\nIf specified, each of the key/value pairs are added to the calico-kube-controllers Deployment nodeSelector provided\nthe key does not already exist in the object's nodeSelector.\nIf used in conjunction with ControlPlaneNodeSelector, that nodeSelector is set on the calico-kube-controllers Deployment\nand each of this field's key/value pairs are added to the calico-kube-controllers Deployment nodeSelector provided\nthe key does not already exist in the object's nodeSelector.\nIf omitted, the calico-kube-controllers Deployment will use its default value for nodeSelector.\nWARNING: Please note that this field will modify the default calico-kube-controllers Deployment nodeSelector.","type":"object"},"tolerations":{"description":"Tolerations is the calico-kube-controllers pod's tolerations.\nIf specified, this overrides any tolerations that may be set on the calico-kube-controllers Deployment.\nIf omitted, the calico-kube-controllers Deployment will use its default value for tolerations.\nWARNING: Please note that this field will override the default calico-kube-controllers Deployment tolerations.","items":{"description":"The pod this Toleration is attached to tolerates any taint that matches\nthe triple <key,value,effect> using the matching operator <operator>.","properties":{"effect":{"description":"Effect indicates the taint effect to match. Empty means match all taint effects.\nWhen specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.","type":"string"},"key":{"description":"Key is the taint key that the toleration applies to. Empty means match all taint keys.\nIf the key is empty, operator must be Exists; this combination means to match all values and all keys.","type":"string"},"operator":{"description":"Operator represents a key's relationship to the value.\nValid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.\nExists is equivalent to wildcard for value, so that a pod can\ntolerate all taints of a particular category.\nLt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).","type":"string"},"tolerationSeconds":{"description":"TolerationSeconds represents the period of time the toleration (which must be\nof effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,\nit is not set, which means tolerate the taint forever (do not evict). Zero and\nnegative values will be treated as 0 (evict immediately) by the system.","format":"int64","type":"integer"},"value":{"description":"Value is the taint value the toleration matches to.\nIf the operator is Exists, the value should be empty, otherwise just a regular string.","type":"string"}},"type":"object"},"type":"array"}},"type":"object"}},"type":"object"}},"type":"object"}},"type":"object"},"calicoNetwork":{"description":"CalicoNetwork specifies networking configuration options for Calico.","properties":{"bgp":{"description":"BGP configures whether or not to enable Calico's BGP capabilities.","enum":["Enabled","Disabled"],"type":"string"},"bpfNetworkBootstrap":{"description":"BPFNetworkBootstrap manages the initial networking setup required to configure the BPF dataplane.\nWhen enabled, the operator tries to bootstraps access to the Kubernetes API Server\nby using the Kubernetes service and its associated endpoints.\nThis field should be enabled only if linuxDataplane is set to \"BPF\".\nIf another dataplane is selected, this field must be omitted or explicitly set to Disabled.\nWhen disabled and linuxDataplane is BPF, you must manually provide the Kubernetes API Server\ninformation via the \"kubernetes-service-endpoint\" ConfigMap. It is invalid to use both the ConfigMap\nand have this field set to true at the same time.\nDefault: Disabled","enum":["Disabled","Enabled"],"type":"string"},"clusterRoutingMode":{"description":"ClusterRoutingMode controls how nodes get a route to a workload on another node,\nwhen that workload's IP comes from an IP Pool with vxlanMode: Never. When ClusterRoutingMode is BIRD,\nconfd and BIRD program that route. When ClusterRoutingMode is Felix, it is expected that Felix will program that route.\nFelix always programs such routes for IP Pools with vxlanMode: Always or vxlanMode: CrossSubnet. [Default: BIRD]","enum":["BIRD","Felix"],"type":"string"},"containerIPForwarding":{"description":"ContainerIPForwarding configures whether ip forwarding will be enabled for containers in the CNI configuration.\nDefault: Disabled","enum":["Enabled","Disabled"],"type":"string"},"hostPorts":{"description":"HostPorts configures whether or not Calico will support Kubernetes HostPorts. Valid only when using the Calico CNI plugin.\nDefault: Enabled","enum":["Enabled","Disabled"],"type":"string"},"ipPools":{"description":"IPPools contains a list of IP pools to manage. If nil, a single IPv4 IP pool\nwill be created by the operator. If an empty list is provided, the operator will not create any IP pools and will instead\nwait for IP pools to be created out-of-band.\nIP pools in this list will be reconciled by the operator and should not be modified out-of-band.","items":{"properties":{"allowedUses":{"description":"AllowedUse controls what the IP pool will be used for.  If not specified or empty, defaults to\n[\"Tunnel\", \"Workload\"] for back-compatibility","items":{"type":"string"},"type":"array"},"assignmentMode":{"description":"AssignmentMode determines if IP addresses from this pool should be  assigned automatically or on request only","type":"string"},"blockSize":{"description":"BlockSize specifies the CIDR prefex length to use when allocating per-node IP blocks from\nthe main IP pool CIDR.\nDefault: 26 (IPv4), 122 (IPv6)","format":"int32","type":"integer"},"cidr":{"description":"CIDR contains the address range for the IP Pool in classless inter-domain routing format.","type":"string"},"disableBGPExport":{"default":false,"description":"DisableBGPExport specifies whether routes from this IP pool's CIDR are exported over BGP.\nDefault: false","type":"boolean"},"disableNewAllocations":{"description":"DisableNewAllocations specifies whether or not new IP allocations are allowed from this pool.\nThis is useful when you want to prevent new pods from receiving IP addresses from this pool, without\nimpacting any existing pods that have already been assigned addresses from this pool.","type":"boolean"},"encapsulation":{"description":"Encapsulation specifies the encapsulation type that will be used with\nthe IP Pool.\nDefault: IPIP","enum":["IPIPCrossSubnet","IPIP","VXLAN","VXLANCrossSubnet","None"],"type":"string"},"name":{"description":"Name is the name of the IP pool. If omitted, this will be generated.","type":"string"},"natOutgoing":{"description":"NATOutgoing specifies if NAT will be enabled or disabled for outgoing traffic.\nDefault: Enabled","enum":["Enabled","Disabled"],"type":"string"},"nodeSelector":{"description":"NodeSelector specifies the node selector that will be set for the IP Pool.\nDefault: 'all()'","type":"string"}},"required":["cidr"],"type":"object"},"maxItems":25,"type":"array"},"kubeProxyManagement":{"description":"KubeProxyManagement controls whether the operator manages the kube-proxy DaemonSet.\nWhen enabled, the operator will manage the DaemonSet by patching it:\nit disables kube-proxy if the dataplane is BPF, or enables it otherwise.\nDefault: Disabled","enum":["Disabled","Enabled"],"type":"string"},"linuxDataplane":{"description":"LinuxDataplane is used to select the dataplane used for Linux nodes. In particular, it\ncauses the operator to add required mounts and environment variables for the particular dataplane.\nIf not specified, iptables mode is used.\nDefault: Iptables","enum":["Iptables","BPF","VPP","Nftables"],"type":"string"},"linuxPolicySetupTimeoutSeconds":{"description":"LinuxPolicySetupTimeoutSeconds delays new pods from running containers\nuntil their policy has been programmed in the dataplane.\nThe specified delay defines the maximum amount of time\nthat the Calico CNI plugin will wait for policy to be programmed.\nOnly applies to pods created on Linux nodes.\n* A value of 0 disables pod startup delays.\nDefault: 0","format":"int32","type":"integer"},"mtu":{"description":"MTU specifies the maximum transmission unit to use on the pod network.\nIf not specified, Calico will perform MTU auto-detection based on the cluster network.","format":"int32","type":"integer"},"multiInterfaceMode":{"description":"MultiInterfaceMode configures what will configure multiple interface per pod. Only valid for Calico Enterprise installations\nusing the Calico CNI plugin.\nDefault: None","enum":["None","Multus"],"type":"string"},"nodeAddressAutodetectionV4":{"description":"NodeAddressAutodetectionV4 specifies an approach to automatically detect node IPv4 addresses. If not specified,\nwill use default auto-detection settings to acquire an IPv4 address for each node.","properties":{"canReach":{"description":"CanReach enables IP auto-detection based on which source address on the node is used to reach the\nspecified IP or domain.","type":"string"},"cidrs":{"description":"CIDRS enables IP auto-detection based on which addresses on the nodes are within\none of the provided CIDRs.","items":{"type":"string"},"type":"array"},"firstFound":{"description":"FirstFound uses default interface matching parameters to select an interface, performing best-effort\nfiltering based on well-known interface names.","type":"boolean"},"interface":{"description":"Interface enables IP auto-detection based on interfaces that match the given regex.","type":"string"},"kubernetes":{"description":"Kubernetes configures Calico to detect node addresses based on the Kubernetes API.","enum":["NodeInternalIP"],"type":"string"},"skipInterface":{"description":"SkipInterface enables IP auto-detection based on interfaces that do not match\nthe given regex.","type":"string"}},"type":"object"},"nodeAddressAutodetectionV6":{"description":"NodeA