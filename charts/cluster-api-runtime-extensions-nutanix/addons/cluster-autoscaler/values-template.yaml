fullnameOverride: "cluster-autoscaler-{{ index .Cluster.Annotations "caren.nutanix.com/cluster-uuid" }}"

cloudProvider: clusterapi

image:
  # Cluster Autoscaler before 1.35.1 assumes the infrastructure provider serves the same API version
  # as core CAPI, so with CAPI at v1beta2 and CAPX at v1beta1 it watches a resource that does not
  # exist, never syncs, and crash-loops. Fixed by kubernetes/autoscaler#9458, released in 1.35.1.
  # See https://github.com/kubernetes/autoscaler/issues/9439.
  # Keep this override until the chart pinned in make/addons.mk ships appVersion >= 1.35.1;
  # 9.59.0, the newest chart, still hard-codes image.tag v1.35.0, which is affected.
  tag: v1.36.1

# Always trigger a scale-out if replicas are less than the min.
extraArgs:
  enforce-node-group-min-size: true

# Enable it to run in a 1 Node cluster.
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

# Limit a single cluster-autoscaler Deployment to a single Cluster.
autoDiscovery:
  clusterName: "{{ .Cluster.Name }}"
  # The controller failed with an RBAC error trying to watch CAPI objects at the cluster scope without this.
  labels:
    - namespace: "{{ .Cluster.Namespace }}"

# For workload clusters it is not possible to use the in-cluster client.
# To simplify the configuration, use the admin kubeconfig generated by CAPI for all clusters.
clusterAPIMode: kubeconfig-incluster
clusterAPIWorkloadKubeconfigPath: /cluster/kubeconfig
extraVolumeSecrets:
  kubeconfig:
    name: "{{ .Cluster.Name }}-kubeconfig"
    mountPath: /cluster
    readOnly: true
    items:
      - key: value
        path: kubeconfig
rbac:
  # Create a Role instead of a ClusterRoles to update cluster-api objects
  clusterScoped: false
{{- $capiProvider := index .Cluster.Labels "cluster.x-k8s.io/provider" }}
{{- if eq $capiProvider "aws" }}
  additionalRules:
    - apiGroups:
      - infrastructure.cluster.x-k8s.io
      resources:
      - awsmachinetemplates
      verbs:
      - get
      - list
      - watch
{{- else if eq $capiProvider "docker" }}
  additionalRules:
    - apiGroups:
      - infrastructure.cluster.x-k8s.io
      resources:
      - dockermachinetemplates
      verbs:
      - get
      - list
      - watch
{{- else if eq $capiProvider "nutanix" }}
  additionalRules:
    - apiGroups:
      - infrastructure.cluster.x-k8s.io
      resources:
      - nutanixmachinetemplates
      verbs:
      - get
      - list
      - watch
{{- end }}
