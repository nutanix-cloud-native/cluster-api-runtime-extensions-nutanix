prismCentralEndPoint: {{ .PrismCentralHost }}
prismCentralPort: {{ .PrismCentralPort }}
prismCentralInsecure: {{ .PrismCentralInsecure }}
{{- with .PrismCentralAdditionalTrustBundle }}
prismCentralAdditionalTrustBundle: "{{ . }}"
{{- end }}
{{- with .IPsToIgnore }}
ignoredNodeIPs: [ {{ joinQuoted . }} ]
{{- end }}

# The 0.8.0-dev.1 chart's appVersion is v0.8.0-dev.1 but the release workflow
# published the image without the v prefix. Drop this once the CCM release
# workflow and chart agree on the tag.
image:
  tag: 0.8.0-dev.1

# The Secret containing the credentials will be created by the handler.
createSecret: false
secretName: nutanix-ccm-credentials
{{- with .ControlPlaneEndpoint }}
extraEnv:
  - name: KUBERNETES_SERVICE_HOST
    value: "{{ trimPrefix .Host "https://" }}"
  - name: KUBERNETES_SERVICE_PORT
    value: "{{ .Port }}"
{{- end }}
