# Disable creating the Prism Central credentials Secret, the Secret will be created by the handler.
createPrismCentralSecret: false
# Disable creating the Prism Element credentials Secret, it won't be used the CSI driver as configured here.
createSecret: false
createPESecrets: false
pcSecretName: nutanix-csi-credentials
applyMpioConfigs: {{ .ApplyMpioConfigs }}
# The CSI chart falls back to snapshot.storage.k8s.io/v1beta1 when v1 is not
# served. snapshot-controller 5.x does not install v1beta1, so Helm install
# fails. Only create the class once v1 exists on the workload cluster.
createVolumeSnapshotClass: {{ .CreateVolumeSnapshotClass }}

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoExecute
    operator: Exists
    tolerationSeconds: 300
  - effect: NoSchedule
    operator: Exists
